<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00703c">
  <title>Koordinaten-Werkzeug · Nehlsen Standorte</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="css/tool.css">
</head>
<body>
  <div id="tool-shell">
    <aside aria-label="Koordinaten prüfen">
      <header id="top">
        <h1>Koordinaten-Werkzeug</h1>
        <p>Standorte werden direkt aus standorte.json geladen. Nominatim-Abfragen dauern etwa eine Minute. Orange/rote Treffer bitte prüfen; Pins können gezogen werden.</p>
        <div class="actions">
          <button id="run-geocode" type="button" disabled>Koordinaten ermitteln</button>
          <button id="download-data" type="button" disabled>standorte.json herunterladen</button>
        </div>
        <div id="progress" role="status" aria-live="polite">Daten werden geladen …</div>
      </header>
      <div id="location-list" aria-label="Standortliste"></div>
    </aside>
    <div id="tool-map" role="region" aria-label="Karte zum Prüfen und Verschieben der Koordinaten"></div>
  </div>
  <script src="vendor/leaflet.js"></script>
  <script type="module" src="./js/coordinate-tool.js"></script>
</body>
</html>

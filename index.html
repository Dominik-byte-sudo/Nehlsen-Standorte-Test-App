<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta id="themeColor" name="theme-color" content="#6ab023">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Standorte">
  <meta name="description" content="Standorte der Nehlsen-Gruppe auf einer Karte">
  <title>Nehlsen Standorte</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="vendor/MarkerCluster.css">
  <link rel="stylesheet" href="vendor/MarkerCluster.Default.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="topbar">
        <div class="brand-copy">
          <h1>Standorte</h1>
          <p id="count" aria-live="polite">Standorte werden geladen …</p>
        </div>
        <div class="topbar-actions">
          <img class="brand-logo" src="./assets/nehlsen-logo.png" alt="Nehlsen" width="353" height="86">
        </div>
      </div>
      <div class="searchrow">
        <label class="search">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="q" type="search" placeholder="Ort, PLZ oder Gesellschaft …" aria-label="Standorte durchsuchen" autocomplete="off">
        </label>
        <button class="btn near" id="nearBtn" type="button" aria-label="Standorte in meiner Nähe">
          <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
          In der Nähe
        </button>
      </div>
    </header>
    <div class="tabs" role="tablist" aria-label="Ansicht auswählen">
      <button role="tab" id="tMap" type="button" aria-selected="true" aria-controls="map" tabindex="0">Karte</button>
      <button role="tab" id="tList" type="button" aria-selected="false" aria-controls="list" tabindex="-1">Liste</button>
    </div>
    <main id="workspace">
      <div id="map" role="region" aria-label="Karte mit Nehlsen-Standorten"></div>
      <div id="list" class="hidden" role="list" aria-label="Nehlsen-Standorte"></div>
      <button class="list-toggle" id="listToggle" type="button" aria-expanded="true" aria-controls="list" aria-label="Standortliste ausblenden" title="Standortliste ausblenden">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5-7 7 7 7"/></svg>
      </button>
      <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    </main>
    <footer class="theme-dock" id="themeDock" aria-label="Darstellung">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Dunkelmodus aktivieren" aria-pressed="false">
        <svg class="theme-icon moon-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 15.1A8.5 8.5 0 0 1 8.9 3.6 8.5 8.5 0 1 0 20.4 15.1Z"/></svg>
        <svg class="theme-icon sun-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l-1.42 1.42m11.3-11.3-1.42-1.42"/></svg>
        <span class="theme-label">Dunkelmodus</span>
      </button>
      <button class="appearance-toggle" id="appearanceToggle" type="button" aria-label="Designstil auswählen" aria-expanded="false" aria-controls="appearanceMenu" title="Designstil auswählen">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M9.8 3.4h4.4l.45 2.1a7.2 7.2 0 0 1 1.55.9l2.05-.8 2.2 3.8-1.6 1.35a7.2 7.2 0 0 1 0 1.8l1.6 1.35-2.2 3.8-2.05-.8a7.2 7.2 0 0 1-1.55.9l-.45 2.1H9.8l-.45-2.1a7.2 7.2 0 0 1-1.55-.9l-2.05.8-2.2-3.8 1.6-1.35a7.2 7.2 0 0 1 0-1.8l-1.6-1.35 2.2-3.8 2.05.8a7.2 7.2 0 0 1 1.55-.9l.45-2.1Z"/><circle cx="12" cy="12" r="2.65"/></svg>
      </button>
      <div class="appearance-menu hidden" id="appearanceMenu" role="group" aria-label="Designstil">
        <span class="appearance-title">Designstil</span>
        <button class="design-option" id="designNormal" type="button" aria-pressed="true">Normal</button>
        <button class="design-option" id="designGlass" type="button" aria-pressed="false">Liquid Glass</button>
      </div>
    </footer>
    <section class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sTitle" aria-hidden="true" inert>
      <div class="grab" aria-hidden="true"></div>
      <button class="btn close" id="sClose" type="button" aria-label="Schließen"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="m18 6-12 12M6 6l12 12"/></svg></button>
      <div id="sBody"></div>
    </section>
  </div>
  <script src="vendor/leaflet.js"></script>
  <script src="vendor/leaflet.markercluster.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>

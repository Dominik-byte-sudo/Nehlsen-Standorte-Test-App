<style>
  :root{--green:#00703c;--green-d:#00552d;--ink:#1b2620;--mute:#5d6b63;--line:#e3e8e5;--bg:#f5f7f6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  #app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;background:#fff;position:relative;overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,.08)}
  header{background:var(--green);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 12px}
  header h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.2px}
  header p{margin:2px 0 10px;font-size:12px;opacity:.85}
  .searchrow{display:flex;gap:8px}
  .search{flex:1;position:relative}
  .search input{width:100%;border:0;border-radius:10px;padding:11px 12px 11px 36px;font:inherit;font-size:15px;outline:none}
  .search input:focus{box-shadow:0 0 0 3px rgba(255,255,255,.5)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mute)}
  .btn{border:0;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .btn:focus-visible{outline:3px solid #ffd54a;outline-offset:2px}
  .near{background:#fff;color:var(--green);padding:0 12px;font-size:13px;white-space:nowrap}
  .near:disabled{opacity:.6;cursor:wait}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;background:none;border:0;padding:11px;font:inherit;font-weight:600;font-size:14px;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent}
  .tabs button[aria-selected=true]{color:var(--green);border-color:var(--green)}
  main{flex:1;position:relative;min-height:0}
  #map,#list{position:absolute;inset:0}
  #list{overflow-y:auto;background:#fff}
  .hidden{display:none!important}
  .item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 16px;font:inherit;cursor:pointer}
  .item:hover,.item:focus-visible{background:#f0f6f2;outline:none}
  .item b{display:block;font-size:14px;font-weight:600}
  .item span{display:block;font-size:13px;color:var(--mute);margin-top:2px}
  .dist{float:right;font-size:12px;font-weight:600;color:var(--green);background:#e6f2ec;padding:2px 7px;border-radius:20px;margin-left:8px}
  .empty{padding:40px 24px;text-align:center;color:var(--mute);font-size:14px}
  .toast{position:absolute;left:12px;right:12px;top:12px;z-index:1000;background:#1b2620;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;transition:opacity .3s}
  /* Bottom sheet */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:1001;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.18);padding:10px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s ease;max-height:70%;overflow-y:auto}
  .sheet.open{transform:none}
  .grab{width:40px;height:4px;border-radius:4px;background:#cfd6d2;margin:0 auto 12px}
  .sheet h2{margin:0 30px 4px 0;font-size:17px;line-height:1.3}
  .co{font-size:12px;color:var(--green);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
  .close{position:absolute;right:12px;top:12px;background:#eef1ef;width:32px;height:32px;border-radius:50%;color:var(--ink);font-size:18px}
  .row{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;align-items:flex-start}
  .row:first-of-type{border-top:0}
  .row svg{flex:none;color:var(--green);margin-top:2px}
  .row a{color:var(--ink)}
  .hours{white-space:pre-line}
  .actions{display:flex;gap:8px;margin-top:14px}
  .primary{flex:1;background:var(--green);color:#fff;padding:13px;font-size:15px;text-decoration:none}
  .primary:hover{background:var(--green-d)}
  .secondary{background:#eef1ef;color:var(--ink);padding:13px 14px;font-size:15px;text-decoration:none}
  .leaflet-container{font-family:inherit}
  .pin{background:var(--green);width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
  .me{width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
  .marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:rgba(0,112,60,.25)!important}
  .marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{background:var(--green)!important;color:#fff!important;font-weight:700}
  @media (prefers-reduced-motion:reduce){.sheet,.toast{transition:none}}
</style>

    <div class="searchrow">

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>
        In der Nähe
      </button>
    </div>
  </header>
  <div class="tabs" role="tablist">
    <button role="tab" id="tMap" aria-selected="true">Karte</button>
    <button role="tab" id="tList" aria-selected="false">Liste</button>
  </div>
  <main>
    <div id="map" role="region" aria-label="Karte"></div>
    <div id="list" class="hidden" role="list"></div>
    <div id="toast" class="toast hidden" role="status"></div>
  </main>
  <section class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-labelledby="sTitle">

</div>

const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let me=null, meMarker=null, query="";

const map=L.map("map",{zoomControl:false}).setView([52.9,10.5],6);
L.control.zoom({position:"bottomright"}).addTo(map);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
const icon=L.divIcon({className:"",html:'<div class="pin"></div>',iconSize:[26,26],iconAnchor:[13,26]});
const cluster=L.markerClusterGroup({showCoverageOnHover:false,maxClusterRadius:45});
map.addLayer(cluster);
async function loadCoords(){try{const r=await fetch("standorte.json",{cache:"no-cache"});if(!r.ok)return;const j=await r.json();
  D.forEach(s=>{const c=j[s.co+"|"+s.name];if(c){s.lat=c[0];s.lng=c[1];s.marker.setLatLng(c);}});render();}catch(e){}}
D.forEach(s=>{s.marker=L.marker([s.lat,s.lng],{icon,title:s.co+" – "+s.name,keyboard:true}).on("click",()=>openSheet(s));});

function km(a,b){const R=6371,r=x=>x*Math.PI/180,dLa=r(b.lat-a.lat),dLo=r(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function filtered(){
  const q=query.toLowerCase().trim();
  let r=D.filter(s=>!q||(s.co+" "+s.name+" "+s.addr).toLowerCase().includes(q));
  if(me){r.forEach(s=>s.d=km(me,s));r.sort((a,b)=>a.d-b.d);}
  return r;
}
function render(){
  const r=filtered();
  cluster.clearLayers();cluster.addLayers(r.map(s=>s.marker));
  $("#count").textContent=`${r.length} von ${D.length} Standorten · intern`;
  $("#list").innerHTML=r.length?r.map(s=>`<button class="item" role="listitem" data-id="${s.id}">
    ${me?`<span class="dist">${s.d<10?s.d.toFixed(1):Math.round(s.d)} km</span>`:""}
    <b>${esc(s.co)} · ${esc(s.name)}</b><span>${esc(s.addr)}</span></button>`).join("")
    :`<div class="empty">Kein Standort gefunden für „${esc(query)}“.</div>`;
  if(r.length&&query) map.fitBounds(L.latLngBounds(r.map(s=>[s.lat,s.lng])),{padding:[40,40],maxZoom:13});
}
$("#list").addEventListener("click",e=>{const b=e.target.closest(".item");if(!b)return;const s=D[b.dataset.id];showTab("map");map.setView([s.lat,s.lng],14);openSheet(s);});

const ic={pin:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',

function openSheet(s){
  const dest=encodeURIComponent(s.addr);
  $("#sBody").innerHTML=`<div class="co">${esc(s.co)}</div><h2 id="sTitle">${esc(s.name)}</h2>
   ${me?`<div style="font-size:13px;color:var(--mute);margin-bottom:6px">ca. ${Math.round(km(me,s))} km Luftlinie entfernt</div>`:""}
   <div class="row">${ic.pin}<span>${esc(s.addr)}</span></div>
   <div class="row">${ic.tel}<a href="tel:${s.tel.replace(/[^\d+]/g,"")}">${esc(s.tel)}</a></div>
   <div class="row">${ic.mail}<a href="mailto:${esc(s.mail)}">${esc(s.mail)}</a></div>
   <div class="row">${ic.clock}<span class="hours">${esc(s.hours)}</span></div>
   <div class="actions">
     <a class="btn primary" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${dest}">Route starten</a>
     <a class="btn secondary" target="_blank" rel="noopener" href="https://maps.apple.com/?daddr=${dest}" aria-label="Route in Apple Karten">Apple</a>
   </div>`;
  $("#sheet").classList.add("open");$("#sheet").setAttribute("aria-hidden","false");$("#sClose").focus();
}
function closeSheet(){$("#sheet").classList.remove("open");$("#sheet").setAttribute("aria-hidden","true");}
$("#sClose").onclick=closeSheet;map.on("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});

function showTab(t){const m=t==="map";$("#map").classList.toggle("hidden",!m);$("#list").classList.toggle("hidden",m);
  $("#tMap").setAttribute("aria-selected",m);$("#tList").setAttribute("aria-selected",!m);if(m)setTimeout(()=>map.invalidateSize(),0);else closeSheet();}
$("#tMap").onclick=()=>showTab("map");$("#tList").onclick=()=>showTab("list");

let t;$("#q").addEventListener("input",e=>{clearTimeout(t);t=setTimeout(()=>{query=e.target.value;render();},200);});

function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.remove("hidden");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.add("hidden"),3500);}
$("#nearBtn").onclick=()=>{
  if(!navigator.geolocation)return toast("Standortbestimmung wird nicht unterstützt.");
  const b=$("#nearBtn");b.disabled=true;
  navigator.geolocation.getCurrentPosition(p=>{
    b.disabled=false;me={lat:p.coords.latitude,lng:p.coords.longitude};
    if(meMarker)meMarker.remove();
    meMarker=L.marker([me.lat,me.lng],{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[22,22]})}).addTo(map);
    render();const n=filtered().slice(0,3);
    map.fitBounds(L.latLngBounds([[me.lat,me.lng],...n.map(s=>[s.lat,s.lng])]),{padding:[50,50]});
    toast(`Nächster Standort: ${n[0].co} ${n[0].name} (${Math.round(n[0].d)} km)`);showTab("list");
  },()=>{b.disabled=false;toast("Standort nicht verfügbar – bitte Freigabe erlauben.");},{enableHighAccuracy:true,timeout:10000});
};
render();
loadCoords();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
</html>

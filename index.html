<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00703c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Standorte">
  <meta name="description" content="Standorte der Nehlsen-Gruppe auf einer Karte">
  <title>Nehlsen Standorte</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="vendor/MarkerCluster.css">
  <link rel="stylesheet" href="vendor/MarkerCluster.Default.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Nehlsen Standorte</h1>
      <p id="count" aria-live="polite">Standorte werden geladen …</p>
      <div class="searchrow">
        <label class="search">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Ort, PLZ oder Gesellschaft …" aria-label="Standorte durchsuchen" autocomplete="off">
        </label>
        <button class="btn near" id="nearBtn" type="button" aria-label="Standorte in meiner Nähe">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>
          In der Nähe
        </button>
      </div>
    </header>
    <div class="tabs" role="tablist" aria-label="Ansicht auswählen">
      <button role="tab" id="tMap" type="button" aria-selected="true" aria-controls="map" tabindex="0">Karte</button>
      <button role="tab" id="tList" type="button" aria-selected="false" aria-controls="list" tabindex="-1">Liste</button>
    </div>
    <main>
      <div id="map" role="region" aria-label="Karte mit Nehlsen-Standorten"></div>
      <div id="list" class="hidden" role="list" aria-label="Nehlsen-Standorte"></div>
      <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    </main>
    <section class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sTitle" aria-hidden="true" inert>
      <div class="grab" aria-hidden="true"></div>
      <button class="btn close" id="sClose" type="button" aria-label="Schließen">×</button>
      <div id="sBody"></div>
    </section>
  </div>
  <script src="vendor/leaflet.js"></script>
  <script src="vendor/leaflet.markercluster.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
